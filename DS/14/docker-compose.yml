name: lnu-ds14
services:
  neo4j:
    image: neo4j:5.26.32-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run setup_env.py first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - graph:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  init:
    image: lnu-ds14-api:1.0
    build: .
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    command: [python, import_graph.py]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./results:/app/results
    restart: 'no'
  api:
    image: lnu-ds14-api:1.0
    build: .
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      MODELS_DIR: /models
      REQUEST_LOG: /app/results/requests.jsonl
    ports:
      - '127.0.0.1:8144:8144'
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - ./results:/app/results
      - ./figures:/app/figures
      - ./data:/app/data
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  graph:
