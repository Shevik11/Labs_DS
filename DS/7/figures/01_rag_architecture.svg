<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="820" viewBox="0 0 1780 820"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#51647a"/></marker></defs><rect width="100%" height="100%" fill="#f3f6fa"/><text x="35" y="66" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#172a44">ЛР7 · RAG для візуалізації енергетичних даних</text><text x="35" y="113" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#172a44">Локальні моделі · джерела з попередніх лабораторних · збережені докази кожної відповіді</text><rect x="30" y="190" width="285" height="155" rx="18" fill="#ffffff" stroke="#c7d3df" stroke-width="2"/><text x="50" y="234" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172a44">Запит</text><text x="50" y="275" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">Українська мова</text><text x="50" y="306" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">Нормалізація тексту</text><rect x="370" y="190" width="300" height="155" rx="18" fill="#ffffff" stroke="#c7d3df" stroke-width="2"/><text x="390" y="234" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172a44">Query Encoder</text><text x="390" y="275" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">multilingual-e5-small</text><text x="390" y="306" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">query: + mean pooling</text><rect x="725" y="190" width="300" height="155" rx="18" fill="#ffffff" stroke="#c7d3df" stroke-width="2"/><text x="745" y="234" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172a44">Retriever</text><text x="745" y="275" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">FAISS · cosine similarity</text><text x="745" y="306" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">+ лексичний TF-IDF</text><rect x="1080" y="190" width="300" height="155" rx="18" fill="#e7f1ff" stroke="#c7d3df" stroke-width="2"/><text x="1100" y="234" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172a44">Відбір контексту</text><text x="1100" y="275" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">top-k + поріг оцінки</text><text x="1100" y="306" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">ID і походження джерел</text><rect x="1435" y="190" width="300" height="155" rx="18" fill="#fff0e4" stroke="#c7d3df" stroke-width="2"/><text x="1455" y="234" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172a44">Відмова</text><text x="1455" y="275" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">Немає релевантних даних</text><text x="1455" y="306" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">LLM не викликається</text><rect x="725" y="490" width="300" height="155" rx="18" fill="#ffffff" stroke="#c7d3df" stroke-width="2"/><text x="745" y="534" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172a44">База знань</text><text x="745" y="575" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">ЛР1, ЛР3, ЛР4, ЛР5</text><text x="745" y="606" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">88 фрагментів + індекс</text><rect x="1080" y="490" width="300" height="155" rx="18" fill="#e7f6ee" stroke="#c7d3df" stroke-width="2"/><text x="1100" y="534" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172a44">Generator · LLM</text><text x="1100" y="575" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">Qwen3-0.6B · CPU</text><text x="1100" y="606" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">Контекст + запит</text><rect x="1435" y="490" width="300" height="155" rx="18" fill="#ffffff" stroke="#c7d3df" stroke-width="2"/><text x="1455" y="534" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172a44">Відповідь</text><text x="1455" y="575" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">Текст із [ID джерела]</text><text x="1455" y="606" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">JSON, час і контекст</text><line x1="315" y1="267" x2="370" y2="267" stroke="#51647a" stroke-width="4" marker-end="url(#a)"/><line x1="670" y1="267" x2="725" y2="267" stroke="#51647a" stroke-width="4" marker-end="url(#a)"/><line x1="1025" y1="267" x2="1080" y2="267" stroke="#51647a" stroke-width="4" marker-end="url(#a)"/><line x1="1230" y1="345" x2="1230" y2="490" stroke="#51647a" stroke-width="4" marker-end="url(#a)"/><line x1="875" y1="490" x2="875" y2="345" stroke="#51647a" stroke-width="4" marker-end="url(#a)"/><line x1="1380" y1="567" x2="1435" y2="567" stroke="#51647a" stroke-width="4" marker-end="url(#a)"/><line x1="1380" y1="267" x2="1435" y2="267" stroke="#51647a" stroke-width="4" marker-end="url(#a)"/><line x1="1585" y1="345" x2="1585" y2="490" stroke="#51647a" stroke-width="4" marker-end="url(#a)"/><text x="1255" y="415" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">Є контекст</text><text x="40" y="541" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#172a44">Оцінювання</text><text x="40" y="585" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">12 dev-запитів → вибір параметрів пошуку</text><text x="40" y="620" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">15 test-запитів → три умови генерації</text><text x="40" y="655" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">Без контексту / базовий RAG / налаштований RAG</text><text x="40" y="690" font-family="Arial,sans-serif" font-size="20" font-weight="normal" fill="#172a44">Факти, посилання, відмови та затримки</text><text x="40" y="778" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#172a44">Моделі завантажуються один раз. Подальша генерація працює локально без API.</text></svg>